# Nginx na VPS (host) — SSL + proxy para Docker (porta 8080)
# Certificado: /etc/letsencrypt/live/app.granjauniao.com.br/
# Compatível com certbot certonly --standalone (sem python3-certbot-nginx)

server {
    listen 80;
    server_name app.granjauniao.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.granjauniao.com.br;

    ssl_certificate     /etc/letsencrypt/live/app.granjauniao.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.granjauniao.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
