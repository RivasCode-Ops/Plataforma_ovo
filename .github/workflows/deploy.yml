name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/rivascode-ops/plataforma_ovo/backend
  IMAGE_FRONTEND: ghcr.io/rivascode-ops/plataforma_ovo/frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_BACKEND }}:latest,${{ env.IMAGE_BACKEND }}:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.IMAGE_FRONTEND }}:latest,${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: 30m
          envs: GITHUB_TOKEN,GITHUB_ACTOR,POSTGRES_PASSWORD,SITE_PEDIDO_TOKEN
          script: |
            set -e

            # Clona repo se nao existir
            if [ ! -d /opt/plataforma_ovo ]; then
              git clone https://github.com/RivasCode-Ops/Plataforma_ovo /opt/plataforma_ovo
            fi

            cd /opt/plataforma_ovo
            git pull origin main

            # Cria .env.prod se nao existir (valores vem de secrets via envs:)
            ENV_FILE=/opt/plataforma_ovo/infra/.env.prod
            if [ ! -f "$ENV_FILE" ]; then
              cat > "$ENV_FILE" <<EOF
            POSTGRES_USER=plataforma
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=plataforma_ovo
            SITE_PEDIDO_TOKEN=${SITE_PEDIDO_TOKEN}
            NODE_ENV=production
            PORT=3000
            HTTP_PORT=80
            EOF
              echo ".env.prod criado."
            else
              echo ".env.prod ja existe, mantendo."
            fi

            # Login GHCR
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

            cd /opt/plataforma_ovo/infra
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull backend web
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans
            docker image prune -f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SITE_PEDIDO_TOKEN: ${{ secrets.SITE_PEDIDO_TOKEN }}
