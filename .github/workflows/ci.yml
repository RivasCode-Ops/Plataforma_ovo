name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: plataforma
          POSTGRES_PASSWORD: plataforma_dev
          POSTGRES_DB: plataforma_ovo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plataforma -d plataforma_ovo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:schema
        env:
          DATABASE_URL: postgresql://plataforma:plataforma_dev@localhost:5432/plataforma_ovo
      - name: Apply migrations
        run: |
          for f in migrations/009_webhook_idempotencia.sql migrations/010_plataforma_producao.sql; do
            psql "$DATABASE_URL" -f "$f" || true
          done
        env:
          DATABASE_URL: postgresql://plataforma:plataforma_dev@localhost:5432/plataforma_ovo
      - name: Start API
        run: |
          node src/index.js &
          echo $! > /tmp/api.pid
        env:
          DATABASE_URL: postgresql://plataforma:plataforma_dev@localhost:5432/plataforma_ovo
          PORT: "3000"
          SITE_PEDIDO_TOKEN: ci-test-token
      - run: sleep 4 && bash scripts/ci-smoke.sh http://localhost:3000
      - run: npm run test:ci
        env:
          API_BASE: http://localhost:3000
          SITE_PEDIDO_TOKEN: ci-test-token
          ADMIN_PASSWORD: plataforma123
      - name: Stop API
        if: always()
        run: kill "$(cat /tmp/api.pid)" 2>/dev/null || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: https://app.granjauniao.com.br
          VITE_SITE_PEDIDO_TOKEN: ci-build-placeholder
